<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>GameHub — Administração</title>

<style>
body{
  margin:0;
  background:#0b1020;
  color:#eef2ff;
  font-family:Arial,sans-serif
}

.wrap{
  width:min(900px,92%);
  margin:40px auto
}

h1{
  margin-bottom:6px
}

.box{
  background:#111827;
  border:1px solid #26334d;
  border-radius:16px;
  padding:22px;
  margin:18px 0
}

input,select,textarea,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:9px;
  border:0;
  font-size:15px;
  box-sizing:border-box
}

button{
  background:#14b8a6;
  font-weight:800;
  cursor:pointer
}

.danger{
  background:#ef4444;
  color:#fff
}

.muted{
  color:#94a3b8
}

.game{
  padding:15px;
  border:1px solid #334155;
  border-radius:10px;
  margin:10px 0
}

.top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}

.top button{
  width:auto;
  padding:8px 12px
}

#panel{
  display:none
}
</style>
</head>

<body>

<div class="wrap">

<h1>🔐 GameHub — Administração</h1>

<p class="muted">
Painel local de gestão do conteúdo publicado.
</p>

<!-- LOGIN -->

<div id="login" class="box">

<h2>Entrar</h2>

<p>
Palavra-passe inicial:
<b>admin123</b>.
Altere-a no código antes de publicar se usar este painel estático.
</p>

<input
id="pass"
type="password"
placeholder="Palavra-passe"
>

<button onclick="login()">
Entrar
</button>

<p id="err"></p>

</div>


<!-- PAINEL -->

<div id="panel">


<!-- ADICIONAR JOGO -->

<div class="box">

<h2>Adicionar jogo</h2>

<input
id="title"
placeholder="Nome do jogo"
>

<select id="cat">

<option>PC</option>

<option>Mobile</option>

</select>


<!-- ESCOLHER IMAGEM -->

<label
for="imgFile"
style="display:block;margin-top:8px;font-weight:700"
>
📷 Imagem do jogo
</label>

<input
id="imgFile"
type="file"
accept="image/*"
>


<!-- PRÉ-VISUALIZAÇÃO -->

<div
id="previewBox"
style="display:none;margin:8px 0"
>

<img
id="preview"
style="max-width:220px;max-height:160px
